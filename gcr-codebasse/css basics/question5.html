<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>

    <h1 class="title">Choose Your Plan</h1>

    <main class="pricing">

        <section class="plan">
            <h2>Basic</h2>

            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <div class="price">
                ₹199 / Month
            </div>

            <a href="#">Choose Plan</a>
        </section>

        <section class="plan popular">
            <h2>Standard</h2>

            <ul>
                <li>15 Projects</li>
                <li>50 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <div class="price">
                ₹399 / Month
            </div>

            <a href="#">Choose Plan</a>
        </section>

        <section class="plan">
            <h2>Premium</h2>

            <ul>
                <li>Unlimited Projects</li>
                <li>200 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <div class="price">
                ₹699 / Month
            </div>

            <a href="#">Choose Plan</a>
        </section>

    </main>

</body>
</html>
