<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>

    <!-- Fixed header -->
    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main>

            <h2>Overview</h2>

            <div class="boxes">

                <section class="box">
                    <h3>Total Projects</h3>
                    <p>24</p>
                </section>

                <section class="box">
                    <h3>Completed</h3>
                    <p>18</p>
                </section>

                <section class="box">
                    <h3>Pending</h3>
                    <p>6</p>
                </section>

            </div>

        </main>

    </div>

</body>
</html>
