<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <div class="card-container">

        <div class="card">

            <div class="front">
                <h2>Web Development</h2>
                <img src="https://picsum.photos/300/180" alt="Web Development">
                <p>Hover Me</p>
            </div>

            <div class="back">
                <h2>About Course</h2>
                <p>
                    Learn HTML, CSS and modern responsive
                    web design techniques.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
