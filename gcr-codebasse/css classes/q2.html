<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tooltip Demonstration</title><link rel="stylesheet" href="q2.css">
</head>
<body>
<header><h1>CSS Tooltip Demonstration</h1><p>Hover over each element</p></header>
<main class="tooltip-area">
<div class="tip"><span>HTML</span><div class="tooltip">Structure of a webpage</div></div>
<div class="tip"><span>CSS</span><div class="tooltip">Styles and designs the page</div></div>
<div class="tip"><span>Grid</span><div class="tooltip">Two-dimensional CSS layout</div></div>
<div class="tip"><span>Flexbox</span><div class="tooltip">One-dimensional CSS layout</div></div>
</main>
<footer><p>Tooltips made using only CSS</p></footer>
</body>
</html>
