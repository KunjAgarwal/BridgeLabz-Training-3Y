<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini User Interface</title><link rel="stylesheet" href="q10.css">
</head>
<body>
<header><h1>QuickConnect</h1><p>A simple mini user interface</p></header>
<main>
<section class="card">
<div class="content">
<div class="form-side">
<h2>Create Account</h2>
<p>Fill in the form to get started.</p>
<form>
<label for="name">Name</label><input id="name" type="text" placeholder="Enter your name">
<label for="email">Email</label><input id="email" type="email" placeholder="Enter your email">
<div class="actions"><button type="submit">Sign Up</button><button type="button" class="secondary">Cancel</button></div>
</form>
</div>
<img src="https://picsum.photos/id/1062/420/300" alt="Laptop workspace">
</div>
</section>
</main>
<footer><p>&copy; 2026 QuickConnect</p></footer>
</body>
</html>
