<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UI Components</title><link rel="stylesheet" href="q7.css">
</head>
<body>
<header><h1>Simple User Interface</h1></header>
<main class="card">
<h2>Find Something</h2><p>Use the controls below to search.</p>
<form class="controls">
<input type="search" placeholder="Search here..." aria-label="Search">
<button type="submit">Search</button>
<select aria-label="Choose category"><option>All Categories</option><option>Web Design</option><option>Cloud</option><option>AI</option></select>
</form>
</main>
<footer><p>Clean and responsive UI</p></footer>
</body>
</html>
