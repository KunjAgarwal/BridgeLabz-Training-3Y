<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header>
        <h1>Borders & Padding Demonstration</h1>
        <p>Different border styles and internal spacing.</p>
    </header>

    <main class="box-container">
        <div class="box solid">Solid Border</div>
        <div class="box dashed">Dashed Border</div>
        <div class="box double">Double Border</div>
        <div class="box groove">Groove Border</div>
        <div class="box rounded">Rounded Corners</div>
    </main>

    <footer>Hover over any box to change its border color.</footer>
</body>
</html>
