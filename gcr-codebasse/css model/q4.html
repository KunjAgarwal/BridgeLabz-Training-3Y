<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>
    <header><h1>Shadows & Depth Effects</h1></header>
    <main class="cards">
        <article class="card soft">
            <h2>Soft Shadow</h2>
            <p>A gentle shadow gives this card a floating appearance.</p>
        </article>
        <article class="card hard">
            <h2>Hard Shadow</h2>
            <p>A stronger shadow creates more visual depth.</p>
        </article>
        <article class="card inset">
            <h2>Inset Shadow</h2>
            <p>An inset shadow makes the card look pressed inward.</p>
        </article>
    </main>
</body>
</html>
