<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header><h1>Advanced CSS Selectors</h1></header>
    <main>
        <ul class="items">
            <li>Normal Item</li>
            <li>Important Item</li>
            <li>Third Item</li>
            <li>Fourth Item</li>
            <li>Last Item</li>
        </ul>

        <div class="links">
            <a href="https://example.com">HTTPS Link</a>
            <a href="https://openai.com">Another Link</a>
        </div>

        <form>
            <input type="text" placeholder="Focus me">
            <input type="email" placeholder="Email">
        </form>
    </main>
</body>
</html>
