<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header><h1>CSS Gradient Showcase</h1></header>
    <main>
        <section class="gradient linear">
            <h2>Linear Gradient</h2>
            <p>This section uses a linear gradient that moves across the page.</p>
        </section>
        <section class="gradient radial">
            <h2>Radial Gradient</h2>
            <p>This section uses a radial gradient spreading from the center.</p>
        </section>
    </main>
    <footer>Gradient Background Demonstration</footer>
</body>
</html>
