<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q9 - Form Submit Blocker & Live Errors</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .error-msg { color: #d93025; font-size: 13px; min-height: 18px; margin-top: 4px; }
    button { padding: 10px 18px; cursor: pointer; }
    #successBanner { display: none; margin-top: 16px; padding: 12px; background: #e6f4ea; color: #137333; border: 1px solid #137333; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Account Signup</h2>
  <form id="signupForm" novalidate>
    <div class="field">
      <label for="userName">Name</label>
      <input type="text" id="userName" />
      <div class="error-msg" id="nameError"></div>
    </div>

    <div class="field">
      <label for="userEmail">Email</label>
      <input type="email" id="userEmail" />
      <div class="error-msg" id="emailError"></div>
    </div>

    <div class="field">
      <label for="userPassword">Password</label>
      <input type="password" id="userPassword" />
      <div class="error-msg" id="passwordError"></div>
    </div>

    <button type="submit">Submit Form</button>
  </form>

  <div id="successBanner">Form Submitted Successfully</div>

  <script src="q9.js"></script>
</body>
</html>
