<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q5 - Image Gallery with Modal</title>
  <style>
    body { font-family: sans-serif; max-width: 750px; margin: 40px auto; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .gallery-grid img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
    .gallery-grid img:hover { transform: scale(1.03); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-content {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      max-width: 600px;
      text-align: center;
    }
    .modal-content img { max-width: 100%; max-height: 70vh; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Image Gallery (Click any image to preview)</h2>
  <div class="gallery-grid" id="galleryGrid">
    <img src="https://picsum.photos/id/10/600/400" alt="Forest View" />
    <img src="https://picsum.photos/id/20/600/400" alt="Study Desk" />
    <img src="https://picsum.photos/id/29/600/400" alt="Mountain Peak" />
    <img src="https://picsum.photos/id/42/600/400" alt="Coffee Table" />
    <img src="https://picsum.photos/id/48/600/400" alt="Laptop Setup" />
    <img src="https://picsum.photos/id/54/600/400" alt="Rocky Coast" />
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <img id="modalImage" src="" alt="Preview" />
      <p id="modalCaption"></p>
    </div>
  </div>

  <script src="q5.js"></script>
</body>
</html>
