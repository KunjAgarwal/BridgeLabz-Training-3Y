<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q4 - Theme Switcher</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      transition: background-color 0.3s, color 0.3s;
    }
    body.theme-light { background-color: #ffffff; color: #111111; }
    body.theme-dark  { background-color: #18181b; color: #f4f4f5; }
    body.theme-blue  { background-color: #0f2942; color: #e0f2fe; }
    button { padding: 10px 18px; margin-right: 10px; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body class="theme-light" data-theme="light">
  <h2>Theme Switcher (Light, Dark, Blue)</h2>
  <p>Current active theme: <strong id="activeThemeLabel">light</strong></p>

  <div id="themeControls">
    <button data-select-theme="light">Light Theme</button>
    <button data-select-theme="dark">Dark Theme</button>
    <button data-select-theme="blue">Blue Theme</button>
  </div>

  <script src="q4.js"></script>
</body>
</html>
