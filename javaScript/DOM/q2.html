<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q2 - Live Character Counter</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 40px auto; }
    textarea { width: 100%; height: 120px; padding: 10px; box-sizing: border-box; font-size: 16px; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .counter { font-weight: bold; color: #222; }
    .counter.warning { color: #d4a017; } /* Yellow warning at <= 20 chars[cite: 23] */
    .counter.danger { color: #d93025; }  /* Red danger at 0 chars[cite: 23] */
    button { padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="messageBox" placeholder="Type your message (max 100 characters)..."></textarea>
  <div class="footer">
    <span id="charCounter" class="counter">100 characters remaining</span>
    <button id="resetBtn">Reset</button>
  </div>

  <script src="q2.js"></script>
</body>
</html>
