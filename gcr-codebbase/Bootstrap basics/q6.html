<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="q6.css">
</head>

<body class="bg-light">

    <header class="bg-dark text-white text-center py-5">

        <div class="container">

            <h1 class="fw-bold">
                Contact Us
            </h1>

            <p class="lead mb-0">
                We'd love to hear from you
            </p>

        </div>

    </header>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="fw-bold text-center mb-4">
                            Get In Touch
                        </h2>

                        <form>

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label fw-semibold"
                                >
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label fw-semibold"
                                >
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    placeholder="Enter your phone number"
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="subject"
                                    class="form-label fw-semibold"
                                >
                                    Subject
                                </label>

                                <select
                                    class="form-select"
                                    id="subject"
                                >

                                    <option selected>
                                        Select a subject
                                    </option>

                                    <option>
                                        General Enquiry
                                    </option>

                                    <option>
                                        Technical Support
                                    </option>

                                    <option>
                                        Business Enquiry
                                    </option>

                                    <option>
                                        Feedback
                                    </option>

                                </select>

                            </div>

                            <div class="mb-4">

                                <label
                                    for="message"
                                    class="form-label fw-semibold"
                                >
                                    Message
                                </label>

                                <textarea
                                    class="form-control"
                                    id="message"
                                    rows="5"
                                    placeholder="Write your message here..."
                                    required
                                ></textarea>

                            </div>


                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="agreement"
                                    required
                                >

                                <label
                                    class="form-check-label"
                                    for="agreement"
                                >
                                    I agree to the terms and conditions.
                                </label>

                            </div>


                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg"
                                >
                                    Send Message
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 Contact Us | All Rights Reserved
        </p>

    </footer>

</body>

</html>
