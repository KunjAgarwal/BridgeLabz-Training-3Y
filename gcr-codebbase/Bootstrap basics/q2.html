<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="q2.css">
</head>

<body class="bg-light text-dark">

    <header class="bg-dark text-white text-center p-5">
        <div class="container">

            <h1 class="fw-bold">Kunj Agarwal</h1>

            <p class="lead mb-0">
                Web Developer | Cloud Enthusiast | Problem Solver
            </p>

        </div>
    </header>


    <main>

        <section class="container text-center mt-4 mb-3">

            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300"
                alt="Profile Image"
                class="img-fluid rounded-circle profile-img mb-3"
            >

            <h2 class="fw-bold">Hello, I'm Kunj!</h2>

            <p class="text-secondary">
                I build responsive websites and modern cloud-based
                applications using today's latest technologies.
            </p>


            <div class="mt-4 mb-4">

                <a href="#contact" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>

            </div>

        </section>


        <section id="contact" class="container text-center py-4">

            <div class="row justify-content-center">

                <div class="col-12 col-md-7 col-lg-5">

                    <h3 class="fw-bold mb-3">
                        Contact Me
                    </h3>

                    <form>

                        <input
                            type="text"
                            class="form-control mb-3"
                            placeholder="Your Name"
                        >

                        <input
                            type="email"
                            class="form-control mb-3"
                            placeholder="Your Email"
                        >

                        <textarea
                            class="form-control mb-3"
                            rows="4"
                            placeholder="Your Message"
                        ></textarea>

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <footer class="bg-dark text-white text-center p-3 mt-4">

        <p class="mb-0">
            © 2026 Alex Johnson | All Rights Reserved
        </p>

    </footer>

</body>
</html>
