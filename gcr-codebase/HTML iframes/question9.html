<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>

    <h1>File Upload</h1>

    <p>Please upload only JPG or PNG image files.</p>

    <form>

        <label for="file">Choose a file:</label>
        <input
            type="file"
            id="file"
            name="file"
            accept=".jpg,.png"
            required>

        <br><br>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
