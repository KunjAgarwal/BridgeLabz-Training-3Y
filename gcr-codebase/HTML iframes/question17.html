<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submission Form</title>
</head>
<body>

    <h1>Submit Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe
        name="resultFrame"
        width="500"
        height="200"
        title="Result">
    </iframe>

</body>
</html>
