<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection</title>
</head>

<body>

    <!-- Page Heading -->
    <h1>Travel Selection Page</h1>

    <!-- Country Selection -->
    <label for="country">Country:</label>

    <select id="country" name="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State Selection -->
    <label for="state">State:</label>

    <select id="state" name="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <!-- City Selection -->
    <label for="city">City:</label>

    <select id="city" name="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <!-- Tourist Place Selection -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>India Gate</option>
        <option>Qutub Minar</option>
        <option>Gateway of India</option>
    </select>

    <br><br>

    <!-- Summary -->
    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Mathura, and my favorite tourist place is the Taj Mahal.
    </p>

</body>

</html>
