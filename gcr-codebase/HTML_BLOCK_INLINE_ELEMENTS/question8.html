<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>

<body>

    <!-- School Name -->
    <h1>GLA University</h1>

    <h2>Student Report Card</h2>

    <!-- Student Information -->
    <p><strong>Student Name:</strong> Kunj Agarwal</p>
    <p><strong>Class:</strong> B.Tech CSE</p>

    <!-- Marks Table -->
    <table border="1" title="Student Marks Report">

        <!-- Table Heading -->
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <!-- Marks Sub-Heading -->
        <tr>
            <th>Obtained</th>
            <th>Maximum</th>
        </tr>

        <!-- Subject 1 -->
        <tr>
            <td>Java</td>
            <td>85</td>
            <td>100</td>
        </tr>

        <!-- Subject 2 -->
        <tr>
            <td>DBMS</td>
            <td>82</td>
            <td>100</td>
        </tr>

        <!-- Subject 3 -->
        <tr>
            <td>Cloud Computing</td>
            <td>90</td>
            <td>100</td>
        </tr>

        <!-- Subject 4 -->
        <tr>
            <td>Operating System</td>
            <td>78</td>
            <td>100</td>
        </tr>

        <!-- Subject 5 -->
        <tr>
            <td>Computer Networks</td>
            <td>88</td>
            <td>100</td>
        </tr>

        <!-- Total -->
        <tr>
            <td colspan="2">
                <strong>Total</strong>
            </td>
            <td>423 / 500</td>
        </tr>

        <!-- Percentage -->
        <tr>
            <td colspan="2">
                <strong>Percentage</strong>
            </td>
            <td>84.6%</td>
        </tr>

    </table>

    <!-- Footer -->
    <p>End of Student Report</p>

</body>

</html>
