<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
</head>

<body>

    <!-- Page Heading -->
    <h1>Movie Database</h1>

    <!-- Movie Table -->
    <table border="1" title="Movie Database Table">

        <caption>

        <!-- Table Header -->

            <th>Movie Name</th>
            <th>Genre</th>
            <th>Year</th>
            <th>IMDB Rating</th>
            <th>Link</th>
        </tr>

        <!-- Movie 1 -->
        <tr>
            <td>Inception</td>

            <td>2010</td>
            <td>8.8</td>

                    IMDB
                </a>
            </td>
        </tr>

        <!-- Movie 2 -->
        <tr>
            <td>3 Idiots</td>

            <td>8.4</td>

                    IMDB
                </a>
            </td>
        </tr>

        <!-- Movie 3 -->
        <tr>
            <td>Interstellar</td>

        <!-- Movie 4 -->

            <td colspan="5">

                    Note: IMDB ratings are included for educational purposes.
                </small>
            </td>
        </tr>

    </table>

</body>

</html>
